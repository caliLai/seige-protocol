<!DOCTYPE html>
<html>
<head>
    <style>
        @view-transition { navigation: auto; }

        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.4s;
            animation-timing-function: ease;
        }

        /* ✅ FIX: background is WHITE now */
        body {
            margin: 0;
            background: white;
            animation: gameFadeIn 0.35s ease both;
            font-family: Arial;
        }

        @keyframes gameFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ✅ Keep canvas centered but with spacing */
        canvas {
            display: block;
            margin: 20px auto;
        }

        #unitSelectionScreen {
            padding: 10px;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;
        }

        .panel {
            background: white;
            padding: 40px;
            text-align: center;
            width: 400px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Top UI -->
    <div id="unitSelectionScreen">
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <div>
                Select your unit type:
                <input type="radio" name="unitSelection" value="unit" checked />
                <label>Unit</label>
                <br>
                <button onclick="startGame()">start</button>
            </div>

            <div id="goldDisplay" style="font-weight:bold; font-size:18px;">
                Gold: 0
            </div>
        </div>
    </div>

    <!-- Game -->
    <canvas id="gameCanvas"></canvas>

    <!-- End Screen -->
    <div id="endScreen">
        <div class="panel">
            <h1>Wave Complete!</h1>
            <p id="goldEarned">Gold Earned: 0</p>
            <p id="towersDestroyed">Towers Destroyed: 0</p>
            <p id="unitsLost">Units Lost: 0</p>
            <button onclick="nextWave()">Next Wave</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../src/data/path.js"></script>
    <script src="../src/data/towerLocations.js"></script>
    <script src="../src/classes/Sprite.js"></script>
    <script src="../src/classes/Unit.js"></script>
    <script src="../src/classes/Tower.js"></script>
    <script src="./game.js"></script>

</body>
</html>
