<!DOCTYPE html>
<html>
  <head>
    <style>
      @view-transition {
        navigation: auto;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.4s;
        animation-timing-function: ease;
      }

      body {
        margin: 0;
        background: white;
        animation: gameFadeIn 0.35s ease both;
        font-family: Arial;
      }

      @keyframes gameFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      canvas {
        display: block;
        margin: 20px auto;
      }

      #unitSelectionScreen {
        padding: 10px;
      }

      #endScreen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
      }

      .panel {
        background: white;
        padding: 40px;
        text-align: center;
        width: 420px;
      }

      button {
        padding: 10px 20px;
        background: black;
        color: white;
        border: none;
        cursor: pointer;
      }

      .goldBox {
        text-align: right;
        font-weight: bold;
        font-size: 18px;
        line-height: 1.7;
      }
    </style>
  </head>

  <body>
    <div id="unitSelectionScreen">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          Select your unit type:
          <input type="radio" name="unitSelection" value="archer" checked />
          <label>Archer</label>
          <input type="radio" name="unitSelection" value="knight" />
          <label>Knight</label>
          <input type="radio" name="unitSelection" value="unit" />
          <label>Unit (Debug)</label>
          <br />
          <button onclick="deployUnit()">deploy unit</button>
        </div>

        <div class="goldBox">
          <div id="goldDisplay">You: 0</div>
          <div id="otherGoldDisplay">Other: 0</div>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="endScreen">
      <div class="panel">
        <h1>Wave Complete!</h1>
        <p id="results"></p>
        <button onclick="nextWave()">Next Wave</button>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
