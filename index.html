<!DOCTYPE html>
<html>
<head>
    <style>
        /* ===== Base Layout ===== */
        body {
            margin: 0;
            font-family: Arial;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        /* ===== Screens ===== */
        #unitSelectionScreen {
            padding: 10px;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;
        }

        /* ===== UI Components ===== */
        .panel {
            background: white;
            padding: 40px;
            text-align: center;
            width: 400px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* TODO: move styles into separate CSS file */
    </style>
</head>

<body>

    <!-- ===== Top UI + Unit Selection ===== -->
    <div id="unitSelectionScreen">
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <div>
                Select your unit type:
                <input type="radio" name="unitSelection" value="unit" checked />
                <label>Unit</label>
                <br>
                <button onclick="startGame()">start</button>
            </div>

            <!-- Gold Display -->
            <div id="goldDisplay" style="font-weight:bold; font-size:18px;">
                Gold: 0
            </div>
        </div>
    </div>

    <!-- ===== Game Canvas ===== -->
    <canvas id="gameCanvas"></canvas>

    <!-- ===== End Screen ===== -->
    <div id="endScreen">
        <div class="panel">
            <h1>Wave Complete!</h1>
            <p id="goldEarned">Gold Earned: 0</p>
            <p id="towersDestroyed">Towers Destroyed: 0</p>
            <p id="unitsLost">Units Lost: 0</p>
            <button onclick="nextWave()">Next Wave</button>
        </div>
    </div>

    <!-- ===== Scripts ===== -->
    <script src="./src/data/path.js"></script>
    <script src="./src/data/towerlocations.js"></script>
    <script src="./src/classes/Sprite.js"></script>
    <script src="./src/classes/Unit.js"></script>
    <script src="./src/classes/Tower.js"></script>
    <script src="./game/game.js"></script>

</body>
</html>
