<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Waypoint Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #141414;
      color: #f2f2f2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #202020;
      border-bottom: 1px solid #333;
    }

    label {
      color: #cfcfcf;
      font-size: 14px;
    }

    select,
    button {
      border: 1px solid #555;
      border-radius: 6px;
      background: #2d2d2d;
      color: #fff;
      font: inherit;
      padding: 7px 10px;
    }

    button {
      cursor: pointer;
    }

    main {
      overflow: auto;
      padding: 16px;
    }

    canvas {
      display: block;
      width: min(1120px, 100%);
      height: auto;
      background: #090909;
      border: 1px solid #444;
    }

    #readout {
      min-width: 260px;
      margin-left: auto;
      color: #ffe66d;
      font: 13px/1.4 Consolas, Monaco, monospace;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <label for="mapSelect">Map</label>
    <select id="mapSelect"></select>
    <button id="toggleLabels" type="button" aria-pressed="true">Labels on</button>
    <button id="copyPath" type="button">Copy path</button>
    <div id="readout">Move over a waypoint</div>
  </header>

  <main>
    <canvas id="mapCanvas" width="1120" height="640"></canvas>
  </main>

  <script type="module">
    import { MAP_SEQUENCE } from '../src/data/maps.js';

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const toggleLabels = document.getElementById('toggleLabels');
    const copyPath = document.getElementById('copyPath');
    const readout = document.getElementById('readout');

    let selectedIndex = 0;
    let showLabels = true;
    let backgroundImage = new Image();

    MAP_SEQUENCE.forEach((map, index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = `${index + 1}. ${map.name}`;
      mapSelect.appendChild(option);
    });

    const currentMap = () => MAP_SEQUENCE[selectedIndex];

    const loadBackground = () => {
      const map = currentMap();
      backgroundImage = new Image();
      backgroundImage.onload = draw;
      backgroundImage.onerror = draw;
      backgroundImage.src = `..${map.background}`;
    };

    const drawPath = (path) => {
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 230, 0, 0.9)';
      ctx.fillStyle = 'rgba(255, 230, 0, 0.96)';
      ctx.font = '12px Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.beginPath();
      path.forEach((point, index) => {
        if (index === 0) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      });
      ctx.stroke();

      path.forEach((point, index) => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 9, 0, Math.PI * 2);
        ctx.fill();

        if (showLabels) {
          ctx.fillStyle = '#101010';
          ctx.fillText(String(index), point.x, point.y);
          ctx.fillStyle = 'rgba(255, 230, 0, 0.96)';
        }
      });

      ctx.restore();
    };

    const drawTowers = (towers) => {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fillStyle = 'rgba(30, 30, 30, 0.75)';
      ctx.font = '11px Consolas, Monaco, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      towers.forEach((tower, index) => {
        ctx.beginPath();
        ctx.rect(tower.x - 12, tower.y - 12, 24, 24);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText(`T${index}`, tower.x, tower.y);
        ctx.fillStyle = 'rgba(30, 30, 30, 0.75)';
      });

      ctx.restore();
    };

    const draw = () => {
      const map = currentMap();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (backgroundImage.complete && backgroundImage.naturalWidth) {
        ctx.drawImage(backgroundImage, 0, 0);
      } else {
        ctx.fillStyle = '#101010';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      drawPath(map.path);
      drawTowers(map.towers || []);
    };

    const nearestWaypoint = (x, y) => {
      let best = null;
      let bestDistance = Infinity;

      currentMap().path.forEach((point, index) => {
        const distance = Math.hypot(point.x - x, point.y - y);
        if (distance < bestDistance) {
          best = { index, point, distance };
          bestDistance = distance;
        }
      });

      return best;
    };

    mapSelect.addEventListener('change', () => {
      selectedIndex = Number(mapSelect.value);
      readout.textContent = 'Move over a waypoint';
      loadBackground();
    });

    toggleLabels.addEventListener('click', () => {
      showLabels = !showLabels;
      toggleLabels.textContent = showLabels ? 'Labels on' : 'Labels off';
      toggleLabels.setAttribute('aria-pressed', String(showLabels));
      draw();
    });

    copyPath.addEventListener('click', async () => {
      const text = JSON.stringify(currentMap().path, null, 2);
      await navigator.clipboard.writeText(text);
      readout.textContent = 'Path copied';
    });

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (canvas.width / rect.width);
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);
      const nearest = nearestWaypoint(x, y);
      if (!nearest || nearest.distance > 40) {
        readout.textContent = `x:${Math.round(x)} y:${Math.round(y)}`;
        return;
      }

      readout.textContent = `#${nearest.index} { x: ${nearest.point.x}, y: ${nearest.point.y} }`;
    });

    loadBackground();
  </script>
</body>
</html>
