<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Protocol — The Warroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login/login-styles.css" />
  <link rel="stylesheet" href="/start-screen/start-screen-styles.css" />
  <script>
    // Runs synchronously before <body> is parsed so the doors never paint
    // when navigating back from another in-app screen (e.g. unit roster).
    if (sessionStorage.getItem('skipDoorAnimation') === '1') {
      sessionStorage.removeItem('skipDoorAnimation');
      document.documentElement.classList.add('no-door-animation');
    }
  </script>
</head>
<body>

  <!-- ═══ CASTLE DOOR LOADER ═══ -->
  <div id="doorLoader" aria-hidden="true">
    <div class="door door-left">
      <div class="door-strap s-top"></div>
      <div class="door-strap s-mid"></div>
      <div class="door-strap s-bot"></div>
      <div class="door-handle"></div>
    </div>
    <div class="door door-right">
      <div class="door-strap s-top"></div>
      <div class="door-strap s-mid"></div>
      <div class="door-strap s-bot"></div>
      <div class="door-handle"></div>
    </div>
    <div class="loader-text">▌ THE GATES OPEN ▐</div>
  </div>

  <div class="game-frame lobby-bg">
    <div class="scanlines-overlay"></div>
    <div class="lobby-banner" aria-hidden="true"></div>

    <!-- ═══ TREASURY PLAQUE (hangs in the top-right corner) ═══ -->
    <div class="treasury-plaque" aria-label="Treasury">
      <div class="treasury-chain treasury-chain-left" aria-hidden="true"></div>
      <div class="treasury-chain treasury-chain-right" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-tl" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-tr" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-bl" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-br" aria-hidden="true"></div>
      <svg class="treasury-coin" width="18" height="18" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="3" y="1"  width="8" height="1" fill="#7a600c"/>
        <rect x="2" y="2"  width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="2"  width="8" height="1" fill="#f5c518"/>
        <rect x="11" y="2" width="1" height="1" fill="#7a600c"/>
        <rect x="1" y="3"  width="1" height="8" fill="#7a600c"/>
        <rect x="2" y="3"  width="10" height="8" fill="#f5c518"/>
        <rect x="12" y="3" width="1" height="8" fill="#7a600c"/>
        <rect x="2" y="11" width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="11" width="8" height="1" fill="#f5c518"/>
        <rect x="11" y="11" width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="12" width="8" height="1" fill="#7a600c"/>
        <rect x="5" y="4"  width="1" height="6" fill="#ffd84a"/>
        <rect x="6" y="3"  width="2" height="1" fill="#ffd84a"/>
        <rect x="6" y="10" width="2" height="1" fill="#ffd84a"/>
        <rect x="8" y="4"  width="1" height="6" fill="#c49a12"/>
        <rect x="4" y="5"  width="1" height="4" fill="#c49a12"/>
        <rect x="9" y="5"  width="1" height="4" fill="#c49a12"/>
      </svg>
      <span class="treasury-label">POINTS</span>
      <span id="treasuryAmount" class="treasury-amount">0</span>
    </div>

    <!-- ═══ TORCHES ═══ -->
    <div class="torch torch-left" aria-hidden="true">
      <div class="torch-glow"></div>
      <div class="fire fire-left">
        <div class="fp" style="background:transparent"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:transparent"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:transparent"></div>
        <div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#fff7aa"></div>
        <div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#f5c518"></div>
        <div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div>
        <div class="fp" style="background:transparent"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:transparent"></div>
      </div>
      <div class="torch-pole"></div>
      <svg class="torch-bracket" width="30" height="16" viewBox="0 0 30 16"><rect x="8" y="0" width="14" height="6" fill="#4a4035" stroke="#000" stroke-width="2"/><rect x="4" y="6" width="22" height="4" fill="#3a3228" stroke="#000" stroke-width="2"/></svg>
    </div>
    <div class="torch torch-right" aria-hidden="true">
      <div class="torch-glow torch-glow-delayed"></div>
      <div class="fire fire-right">
        <div class="fp" style="background:transparent"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:transparent"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:transparent"></div>
        <div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#fff7aa"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#fff7aa"></div>
        <div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#f5c518"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#f5c518"></div>
        <div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div><div class="fp" style="background:#e85d2a"></div>
        <div class="fp" style="background:transparent"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:#c0392b"></div><div class="fp" style="background:transparent"></div>
      </div>
      <div class="torch-pole"></div>
      <svg class="torch-bracket" width="30" height="16" viewBox="0 0 30 16"><rect x="8" y="0" width="14" height="6" fill="#4a4035" stroke="#000" stroke-width="2"/><rect x="4" y="6" width="22" height="4" fill="#3a3228" stroke="#000" stroke-width="2"/></svg>
    </div>

    <!-- ═══ MENU CARD ═══ -->
    <div class="menu-card-wrapper">
      <div class="menu-card">
        <div class="menu-card-inner-border"></div>
        <div class="menu-card-corner tl"></div>
        <div class="menu-card-corner tr"></div>
        <div class="menu-card-corner bl"></div>
        <div class="menu-card-corner br"></div>

        <div class="menu-card-content">

          <div class="title-block">
            <div id="titleLine1" class="title-line"></div>
            <div id="titleLine2" class="title-line"></div>
            <div class="subtitle">— THE WARROOM —</div>
          </div>

          <div class="divider">
            <div class="dash-line"></div>
            <span class="divider-icon">⚔</span>
            <div class="dash-line"></div>
          </div>

          <div class="user-bar">
            HAILED AS:
            <button type="button" id="userNameBtn" class="user-name-btn" title="Change name">
              <span id="userName" class="user-name">…</span>
              <svg class="user-name-pencil" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
                <rect x="6" y="1" width="2" height="2" fill="currentColor"/>
                <rect x="5" y="2" width="2" height="2" fill="currentColor"/>
                <rect x="4" y="3" width="2" height="2" fill="currentColor"/>
                <rect x="3" y="4" width="2" height="2" fill="currentColor"/>
                <rect x="2" y="5" width="2" height="2" fill="currentColor"/>
                <rect x="1" y="6" width="2" height="2" fill="currentColor"/>
                <rect x="1" y="8" width="2" height="1" fill="currentColor"/>
              </svg>
            </button>
          </div>


          <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite"></div>

          <div class="menu-buttons">
            <button id="newGameBtn" class="px-btn menu-btn selected">⚔ PLAY NOW</button>
            <button id="rosterBtn" class="px-btn menu-btn">⚜ UNIT ROSTER</button>
            <button id="achievementsBtn" class="px-btn menu-btn">★ HALL OF DEEDS</button>
            <button id="settingsBtn" class="px-btn menu-btn">⚙ ROYAL DECREES</button>
            <button id="creditsBtn" class="px-btn menu-btn">📜 SCRIBES &amp; SCROLLS</button>
            <button id="logoutBtn" class="px-btn menu-btn menu-btn-danger">⏻ ABANDON KEEP</button>
          </div>

        </div>
      </div>
    </div>

    <div class="floor">
      <div class="floor-line floor-line-top"></div>
      <div class="floor-line floor-line-bottom"></div>
    </div>
    <div class="frame-edge frame-edge-top"></div>
    <div class="frame-edge frame-edge-left"></div>
    <div class="frame-edge frame-edge-right"></div>

  </div>

  <!-- ═══ USERNAME PROMPT (new users only) ═══ -->
  <div id="usernamePrompt" class="username-overlay hidden" aria-hidden="true">
    <div class="username-card">
      <div class="username-card-inner-border"></div>
      <div class="username-card-corner tl"></div>
      <div class="username-card-corner tr"></div>
      <div class="username-card-corner bl"></div>
      <div class="username-card-corner br"></div>

      <div class="username-card-content">
        <div class="username-title">⚜ DECLARE THY NAME ⚜</div>
        <div class="username-subtitle">— A NAME UNHEARD IN THESE LANDS —</div>

        <div class="divider username-divider">
          <div class="dash-line"></div>
          <span class="divider-icon">⚔</span>
          <div class="dash-line"></div>
        </div>

        <form id="usernameForm" novalidate>
          <label for="usernameInput" class="username-label">▶ ENGRAVE THY TITLE</label>
          <input type="text" id="usernameInput" class="username-input" placeholder="SIR_LANCELOT" maxlength="20" autocomplete="off" spellcheck="false" />
          <p id="usernameError" class="username-error"></p>
          <button type="submit" id="usernameSubmit" class="px-btn username-submit-btn">
            <span id="usernameSubmitText">⚜ CLAIM THIS NAME ⚜</span>
            <span id="usernameSubmitLoading" class="username-loading">█ SCRIBING… █</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/login/title-shimmer.js"></script>
  <script type="module" src="/start-screen/start-screen.js"></script>
</body>
</html>
