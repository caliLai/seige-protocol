<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege Protocol — War Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login/login-styles.css" />
  <link rel="stylesheet" href="/start-screen/start-screen-styles.css" />
  <link rel="stylesheet" href="/lobby/lobby-styles.css" />
</head>
<body>

  <div class="game-frame stone-bg lobby-frame">
    <div class="scanlines-overlay"></div>

    <!-- ═══ TREASURY PLAQUE ═══ -->
    <div class="treasury-plaque" aria-label="Treasury">
      <div class="treasury-chain treasury-chain-left" aria-hidden="true"></div>
      <div class="treasury-chain treasury-chain-right" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-tl" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-tr" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-bl" aria-hidden="true"></div>
      <div class="treasury-rivet treasury-rivet-br" aria-hidden="true"></div>
      <svg class="treasury-coin" width="18" height="18" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="3" y="1"  width="8" height="1" fill="#7a600c"/>
        <rect x="2" y="2"  width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="2"  width="8" height="1" fill="#f5c518"/>
        <rect x="11" y="2" width="1" height="1" fill="#7a600c"/>
        <rect x="1" y="3"  width="1" height="8" fill="#7a600c"/>
        <rect x="2" y="3"  width="10" height="8" fill="#f5c518"/>
        <rect x="12" y="3" width="1" height="8" fill="#7a600c"/>
        <rect x="2" y="11" width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="11" width="8" height="1" fill="#f5c518"/>
        <rect x="11" y="11" width="1" height="1" fill="#7a600c"/>
        <rect x="3" y="12" width="8" height="1" fill="#7a600c"/>
        <rect x="5" y="4"  width="1" height="6" fill="#ffd84a"/>
        <rect x="6" y="3"  width="2" height="1" fill="#ffd84a"/>
        <rect x="6" y="10" width="2" height="1" fill="#ffd84a"/>
        <rect x="8" y="4"  width="1" height="6" fill="#c49a12"/>
        <rect x="4" y="5"  width="1" height="4" fill="#c49a12"/>
        <rect x="9" y="5"  width="1" height="4" fill="#c49a12"/>
      </svg>
      <span class="treasury-label">POINTS</span>
      <span id="treasuryAmount" class="treasury-amount">0</span>
    </div>

    <!-- ═══ LOBBY HEADER ═══ -->
    <div class="lobby-header">
      <button id="backBtn" type="button" class="px-btn lobby-back-btn">◀ RETURN</button>
      <div class="lobby-title-block">
        <div class="lobby-title">⚔ THE WAR ROOM ⚔</div>
        <div class="lobby-subtitle">— CHOOSE THY BATTLE —</div>
      </div>
      <div class="lobby-header-spacer"></div>
    </div>

    <!-- ═══ MAIN BODY (sidebar + preview pane) ═══ -->
    <div class="lobby-body">

      <!-- LEFT: create button + difficulty tabs + room list -->
      <aside class="lobby-sidebar">
        <button type="button" id="createSiegeBtn" class="px-btn create-siege-btn">
          ✦ CREATE SIEGE ✦
        </button>
        <div class="difficulty-tabs" role="tablist">
          <button type="button" class="difficulty-tab is-active" data-diff="recruit" role="tab" aria-selected="true">RECRUIT</button>
          <button type="button" class="difficulty-tab" data-diff="veteran" role="tab" aria-selected="false">VETERAN</button>
          <button type="button" class="difficulty-tab" data-diff="elite" role="tab" aria-selected="false">ELITE</button>
        </div>
        <div id="roomList" class="room-list" role="list"></div>
      </aside>

      <!-- RIGHT: selected-room preview pane -->
      <section class="lobby-preview" id="previewPane">

        <!-- Centered large map preview -->
        <div class="map-preview">
          <div class="map-preview-frame">
            <img id="mapImage" class="map-image" src="/assets/maps/calista-map.png" alt="Battle map preview" />
            <div class="map-overlay map-overlay-tl"></div>
            <div class="map-overlay map-overlay-tr"></div>
            <div class="map-overlay map-overlay-bl"></div>
            <div class="map-overlay map-overlay-br"></div>
          </div>
          <div class="map-caption">
            <span id="mapName">CALISTA HIGHLANDS</span>
            <span class="map-caption-divider">·</span>
            <span id="roomDifficulty" class="diff-badge diff-recruit">RECRUIT</span>
          </div>
        </div>

        <!-- Player slots beneath the map -->
        <div class="player-slots">

          <div class="player-slot player-slot-empty" id="playerSlotSelf">
            <div class="player-icon">
              <div class="player-avatar player-avatar-empty">?</div>
            </div>
            <div class="player-meta">
              <div class="player-name muted">AWAITING THEE…</div>
              <div class="player-stats muted">
                <div class="player-stat">
                  <span class="player-stat-label">UNITS</span>
                  <span class="player-stat-val">—</span>
                </div>
                <div class="player-stat">
                  <span class="player-stat-label">TOWERS FELLED</span>
                  <span class="player-stat-val">—</span>
                </div>
              </div>
            </div>
            <div class="player-status player-status-waiting">WAITING</div>
          </div>

          <div class="player-slot player-slot-empty" id="playerSlotAlly">
            <div class="player-icon">
              <div class="player-avatar player-avatar-empty">?</div>
            </div>
            <div class="player-meta">
              <div class="player-name muted">AWAITING ALLY…</div>
              <div class="player-stats muted">
                <div class="player-stat">
                  <span class="player-stat-label">UNITS</span>
                  <span class="player-stat-val">—</span>
                </div>
                <div class="player-stat">
                  <span class="player-stat-label">TOWERS FELLED</span>
                  <span class="player-stat-val">—</span>
                </div>
              </div>
            </div>
            <div class="player-status player-status-waiting">WAITING</div>
          </div>

        </div>

        <!-- JOIN SIEGE button anchored bottom-right -->
        <div class="join-bar">
          <div class="room-occupancy">
            <span id="occupancyText">1 / 2 KNIGHTS</span>
          </div>
          <button type="button" id="disbandBtn" class="px-btn disband-btn" hidden>
            ☠ DISBAND ☠
          </button>
          <button type="button" id="leaveBtn" class="px-btn leave-btn" hidden>
            ↶ LEAVE SIEGE
          </button>
          <button type="button" id="joinBtn" class="px-btn join-btn">
            ⚔ JOIN SIEGE ⚔
          </button>
          <button type="button" id="startBtn" class="px-btn start-btn" hidden disabled>
            ✦ START SIEGE ✦
          </button>
        </div>

      </section>

    </div>

    <!-- Floating alert -->
    <div id="alertBanner" class="alert-banner lobby-alert" role="alert" aria-live="polite"></div>

    <!-- ═══ DISBAND CONFIRMATION OVERLAY ═══ -->
    <div id="disbandOverlay" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="disbandTitle" aria-hidden="true">
      <div class="confirm-card confirm-card-danger">
        <div class="confirm-card-inner-border"></div>
        <div class="confirm-card-corner tl"></div>
        <div class="confirm-card-corner tr"></div>
        <div class="confirm-card-corner bl"></div>
        <div class="confirm-card-corner br"></div>

        <div class="confirm-card-content">
          <div id="disbandTitle" class="confirm-title">☠ DISBAND SIEGE? ☠</div>

          <div class="divider confirm-divider">
            <div class="dash-line"></div>
            <span class="divider-icon">⚔</span>
            <div class="dash-line"></div>
          </div>

          <p class="confirm-body">
            THY SIEGE <span id="disbandTargetName" class="confirm-target">—</span>
            WILL BE LOST FOREVER. ANY ALLY WITHIN THE WAR ROOM
            WILL BE CAST OUT.
          </p>

          <div class="confirm-actions">
            <button type="button" id="disbandCancelBtn" class="px-btn confirm-cancel-btn">◀ KEEP IT</button>
            <button type="button" id="disbandConfirmBtn" class="px-btn confirm-danger-btn">
              <span id="disbandConfirmText">☠ DISBAND ☠</span>
              <span id="disbandConfirmLoading" class="btn-loading">█ DISBANDING… █</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Frame edges -->
    <div class="frame-edge frame-edge-top"></div>
    <div class="frame-edge frame-edge-left"></div>
    <div class="frame-edge frame-edge-right"></div>
  </div>

  <script type="module" src="/lobby/lobby.js"></script>
</body>
</html>
