<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #unitSelectionScreen {
            padding: 10px;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);

            justify-content: center;
            align-items: center;
        }

        .panel {
            background: white;
            padding: 40px;
            text-align: center;
            width: 400px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="unitSelectionScreen">
        Select your unit type:
        <input type="radio" name="unitSelection" value="unit" checked />
        <label>Unit</label>
        <br>
        <button onclick="startGame()">start</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- END SCREEN -->
    <div id="endScreen">
        <div class="panel">
            <h1>Wave Complete!</h1>
            <p id="goldEarned">Gold Earned: 0</p>
            <p id="towersDestroyed">Towers Destroyed: 0</p>
            <p id="unitsLost">Units Lost: 0</p>

            <button onclick="nextWave()">Next Wave</button>
        </div>
    </div>

    <script src="./src/data/path.js"></script>
    <script src="./src/data/towerlocations.js"></script>
    <script src="./src/classes/Sprite.js"></script>
    <script src="./src/classes/Unit.js"></script>
    <script src="./src/classes/Tower.js"></script>
    <script src="./index.js"></script>

</body>
</html>
